<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platinum Native (WASM)</title>
<style>
  body { margin:0; background:#000; display:flex; justify-content:center; }
  #screen { width:min(100vw, 512px); image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="384"></canvas>
<script>
  // NDS keymask mirror: filled by key events, read by hal_input_poll().
  var __platKeys = 0, __platMic = 0;
  var MAP = { KeyX:0x1, KeyZ:0x2, ShiftRight:0x4, Enter:0x8,
    ArrowRight:0x10, ArrowLeft:0x20, ArrowUp:0x40, ArrowDown:0x80,
    KeyW:0x100, KeyQ:0x200, KeyS:0x400, KeyA:0x800 };
  addEventListener('keydown', function(e){ if (MAP[e.code]) __platKeys |= MAP[e.code]; });
  addEventListener('keyup', function(e){ if (MAP[e.code]) __platKeys &= ~MAP[e.code]; });
  var Module = { canvas: document.getElementById('screen') };
</script>
{{{ SCRIPT }}}
</body>
</html>
